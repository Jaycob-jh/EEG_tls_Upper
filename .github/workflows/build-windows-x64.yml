name: Build Windows x64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag to receive the Windows asset (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source and tests
        run: npm run check && npm test

      - name: Build Windows x64 app
        run: npm run package:win:x64

      - name: Archive app
        shell: pwsh
        run: |
          $source = "dist\曹操-win32-x64"
          $archive = "CaoCao-windows-x64-v${{ github.run_number }}.zip"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Packaged app directory not found: $source"
          }
          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $archive -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaoCao-windows-x64
          path: CaoCao-windows-x64-v${{ github.run_number }}.zip
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" "CaoCao-windows-x64-v${{ github.run_number }}.zip" --clobber
