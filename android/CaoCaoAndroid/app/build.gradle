plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brainlume.caocao'
    compileSdk 35

    defaultConfig {
        applicationId 'com.brainlume.caocao'
        minSdk 26
        targetSdk 35
        versionCode 51
        versionName '0.5.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Same Stage-1 ONNX model family as Upper; inference stays on-device.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.29.0'
}
